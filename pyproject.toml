[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "flotation-research-analyser"
version = "4.0.0"
description = "Portable flotation video landmark extraction, feature analysis, supervised and semi-supervised modelling, evaluation and dashboard"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24,<3", "pandas>=2.0,<3", "matplotlib>=3.7,<4", "scikit-learn>=1.3,<2", "joblib>=1.3,<2"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
